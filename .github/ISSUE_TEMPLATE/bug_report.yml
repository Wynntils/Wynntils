name: Bug report
description: Report a problem with Wynntils.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Found a bug? Tell us what happened and attach your log.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I tested the latest available Wynntils version for my Minecraft version.
          required: true
        - label: This is a bug report, not a support request or feature suggestion.
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Bug category
      options:
        - Crash
        - Incorrect behavior
        - Performance
        - Visual or user interface issue
        - Compatibility issue
        - Other
    validations:
      required: true

  - type: input
    id: wynntils-version
    attributes:
      label: Wynntils version
      description: Run `/wynntils version` if you are unsure.
      placeholder: "4.0.0-beta.1"
    validations:
      required: true

  - type: dropdown
    id: mod-setup
    attributes:
      label: Mod setup
      options:
        - Happens with only Wynntils and required dependencies
        - Happens only when other mods are installed
        - Other mods are installed, but I have not tested without them
        - Not sure
    validations:
      required: true

  - type: upload
    id: log-files
    attributes:
      label: Log or crash report
      description: Attach logs/latest.log from your game folder, plus a crash report if available. If you restarted, use the affected session's archived .log.gz instead. Your launcher can open the game folder if Minecraft cannot start. Remove private information before uploading.
    validations:
      required: false
      accept: ".log,.txt,.gz,.zip"

  - type: textarea
    id: steps
    attributes:
      label: Is it reproducible? If so, how?
      description: Describe what went wrong and what you expected. If you can make it happen again, tell us how. Screenshots or videos are welcome. If you cannot attach a log, mention why.
      placeholder: |
        When I ..., ... happens instead of ...
        It happens every time / sometimes / only happened once.
        To reproduce it: ...
    validations:
      required: true
