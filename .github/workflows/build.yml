name: Spotless, Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main, development]

jobs:
  format-and-build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Cache Loom project data
        uses: actions/cache@v5
        with:
          path: |
            .gradle/loom-cache
            common/.gradle/loom-cache
            fabric/.gradle/loom-cache
            neoforge/.gradle/loom-cache
          key: ${{ runner.os }}-loom-v2-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-loom-v2-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-
            ${{ runner.os }}-loom-v2-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PR caches are scoped to the PR; main provides the shared warm cache.
          cache-read-only: false

      - name: Check formatting, build and test with Gradle
        run: ./gradlew spotlessCheck buildDependents --stacktrace

      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: fabric/build/reports/tests/test/**
