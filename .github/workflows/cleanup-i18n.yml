# Github actions runner will run this script on a schedule

name: Clean up i18n files
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs daily

concurrency:
  group: main-maintenance
  cancel-in-progress: false

jobs:
  cleanup-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_TOKEN }}
          ref: main

      - name: Run remove_unused_i18n.sh
        run: bash utils/remove_unused_i18n.sh

      - name: Commit and push translation changes
        run: |
          git add -- common/src/main/resources/assets/wynntils/lang/*.json
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi
          git config user.name "WynntilsBot"
          git config user.email "admin@wynntils.com"
          git commit -m "chore: [auto-generated] Remove unused i18n entries"
          # Incorporate any commits made since checkout without rewriting main.
          git pull --rebase origin main
          git push origin HEAD:main
