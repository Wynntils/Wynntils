# Github actions runner will run this script on a schedule

name: Update urls.json
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Runs every hour

concurrency:
  group: main-maintenance
  cancel-in-progress: false

jobs:
  update-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_TOKEN }}
          ref: main

      - name: Update Urls
        run: |
          wget -O common/src/main/resources/assets/wynntils/urls.json "https://raw.githubusercontent.com/Wynntils/Static-Storage/main/Data-Storage/urls.json"

      - name: Commit and push URL changes
        run: |
          jq -e 'type == "array"' common/src/main/resources/assets/wynntils/urls.json > /dev/null
          git add -- common/src/main/resources/assets/wynntils/urls.json
          if git diff --cached --quiet; then
            echo "No URL changes to commit."
            exit 0
          fi
          git config user.name "WynntilsBot"
          git config user.email "admin@wynntils.com"
          git commit -m "chore: [auto-generated] Update urls.json"
          # Incorporate any commits made since checkout without rewriting main.
          git pull --rebase origin main
          git push origin HEAD:main
